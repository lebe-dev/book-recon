services:
  book-recon:
    # Fixed version from .env (written by `just deploy`), never latest
    image: tinyops/book-recon:${IMAGE_TAG:?set IMAGE_TAG in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/book-recon.db
      AUDIOBOOKS_DOWNLOAD_DIR: /app/data/audiobooks
    # Audiobook download pages. Bound to localhost: publish via nginx on the host.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - jackett
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  jackett:
    image: linuxserver/jackett
    restart: unless-stopped
    depends_on:
      - flaresolverr
    # Port forwarding to access Jackett Web UI:
    # - ssh -L 9117:localhost:9117 your-server
    # - Open http://localhost:9117
    ports:
      - "127.0.0.1:9117:9117"
    volumes:
      - jackett-config:/config
      - ./jackett/ServerConfig.json:/config/Jackett/ServerConfig.json
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Solves Cloudflare challenges for Jackett (rutracker.org). Not exposed on the host:
  # Jackett reaches it as http://flaresolverr:8191 (FlareSolverrUrl in ServerConfig.json).
  # Limits are measured: ~160M idle, ~700M peak while Chromium solves a challenge.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Moscow
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

volumes:
  jackett-config:
